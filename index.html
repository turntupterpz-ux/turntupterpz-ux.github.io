<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  overflow:hidden;
  font-family:'Inter',sans-serif;
  color:white;

  background:
    radial-gradient(circle at 20% 20%, rgba(0,255,200,.22), transparent 25%),
    radial-gradient(circle at 80% 80%, rgba(170,80,255,.18), transparent 25%),
    linear-gradient(135deg,#04040a,#081117,#04120f);

  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

/* REPLACE THE ENTIRE .bg + .star SECTION WITH THIS */

/* BACKGROUND */
.bg{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

/* STARS */
.star{
  position:absolute;
  color:white;
  opacity:.75;
  animation:drift linear infinite;

  text-shadow:
    0 0 8px rgba(255,255,255,.95),
    0 0 18px rgba(255,255,255,.7),
    0 0 30px rgba(0,255,200,.45),
    0 0 50px rgba(168,85,247,.35);
}

/* INDIVIDUAL STAR POSITIONS */
.star:nth-child(1){left:3%;top:105%;font-size:10px;animation-duration:12s;}
.star:nth-child(2){left:8%;top:100%;font-size:16px;animation-duration:18s;animation-delay:1s;}
.star:nth-child(3){left:14%;top:104%;font-size:8px;animation-duration:15s;animation-delay:4s;}
.star:nth-child(4){left:20%;top:102%;font-size:13px;animation-duration:20s;animation-delay:2s;}
.star:nth-child(5){left:27%;top:108%;font-size:20px;animation-duration:22s;animation-delay:6s;}
.star:nth-child(6){left:34%;top:101%;font-size:12px;animation-duration:16s;animation-delay:3s;}
.star:nth-child(7){left:40%;top:106%;font-size:9px;animation-duration:14s;animation-delay:8s;}
.star:nth-child(8){left:47%;top:103%;font-size:18px;animation-duration:21s;animation-delay:5s;}
.star:nth-child(9){left:53%;top:109%;font-size:14px;animation-duration:19s;animation-delay:2s;}
.star:nth-child(10){left:60%;top:104%;font-size:11px;animation-duration:17s;animation-delay:7s;}
.star:nth-child(11){left:66%;top:107%;font-size:24px;animation-duration:25s;animation-delay:4s;}
.star:nth-child(12){left:72%;top:102%;font-size:10px;animation-duration:15s;animation-delay:9s;}
.star:nth-child(13){left:79%;top:106%;font-size:16px;animation-duration:23s;animation-delay:6s;}
.star:nth-child(14){left:86%;top:103%;font-size:12px;animation-duration:18s;animation-delay:1s;}
.star:nth-child(15){left:92%;top:109%;font-size:20px;animation-duration:26s;animation-delay:5s;}
.star:nth-child(16){left:97%;top:101%;font-size:9px;animation-duration:14s;animation-delay:3s;}

/* FLOATING ANIMATION */
@keyframes drift{
  0%{
    transform:
      translateY(0)
      translateX(0)
      rotate(0deg)
      scale(.7);

    opacity:0;
  }

  10%{
    opacity:.85;
  }

  50%{
    transform:
      translateY(-50vh)
      translateX(20px)
      rotate(90deg)
      scale(1.1);
  }

  100%{
    transform:
      translateY(-120vh)
      translateX(-15px)
      rotate(180deg)
      scale(.8);

    opacity:0;
  }
}

.card{
  width:min(430px,100%);
  position:relative;

  border-radius:32px;
  padding:28px 18px 18px;

  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(20px);

  box-shadow:
    0 20px 70px rgba(0,0,0,.5),
    inset 0 0 30px rgba(255,255,255,.03);

  text-align:center;
}

.logo{
  width:122px;
  height:122px;
  object-fit:cover;
  border-radius:50%;

  box-shadow:
    0 0 40px rgba(0,255,200,.25),
    0 0 70px rgba(168,85,247,.18);
}

h1{
  margin:18px 0 8px;
  font-size:42px;
  letter-spacing:-2px;

  background:linear-gradient(90deg,#fff,#7cffc4,#d0b3ff,#fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.notice{
  margin-bottom:18px;
  padding:16px;

  border-radius:20px;

  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.06);

  line-height:1.5;
  font-size:14px;
}

.button{
  display:flex;
  justify-content:center;
  align-items:center;

  min-height:66px;
  margin:12px 0;

  border-radius:22px;

  text-decoration:none;
  font-weight:800;
  font-size:16px;

  transition:.16s ease;
}

.button:active{
  transform:scale(.96);
}

.primary{
  background:linear-gradient(135deg,#7cffc4,#d6ffb7,#a7ffff);
  color:#041c16;
}

.secondary{

}

.example{
  background:rgba(255,255,255,.06);
  color:white;
  border:1px dashed rgba(255,255,255,.15);
}

.footer{
  margin-top:16px;
  font-size:12px;
  opacity:.55;
}
</style>
