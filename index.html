<!DOCTYPE html>

<head>

<title>TurntUpTerpz</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:'Inter',sans-serif;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 25% 20%, rgba(176,118,255,.28), transparent 28%),
    radial-gradient(circle at 75% 80%, rgba(96,255,209,.18), transparent 26%),
    #050512;
  color:#fff;
}
.shell{
  width:min(430px,100%);
  border-radius:32px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(22px);
  padding:24px 18px 18px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.52);
}
.logo{width:124px;height:124px;border-radius:50%;object-fit:cover}
h1{
  margin:16px 0 6px;
  font-size:40px;
  letter-spacing:-1.4px;
  background:linear-gradient(90deg,#fff,#d0b3ff,#96fff0);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.notice{
  margin:0 0 18px;
  padding:16px;
  border-radius:18px;
  background:rgba(0,0,0,.22);
  border:1px solid rgba(255,255,255,.08);
}
.button{
  display:flex;align-items:center;justify-content:center;
  min-height:66px;
  margin:12px 0;
  border-radius:22px;
  text-decoration:none;
  font-weight:800;
  color:#fff;
  background:linear-gradient(135deg,#8b5cf6,#b86cff,#6fe8d9);
}
.button.secondary{color:#08141a;background:linear-gradient(135deg,#98ffeb,#fff1a8)}
.button.example{background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.18)}
.footer{margin-top:14px;font-size:12px;opacity:.56}
</style>
</head>
<body>
<div class="shell">
  <img class="logo" src="logo.png" alt="">
  <h1>TurntUpTerpz</h1>
  <div class="notice">Press the 3️⃣ dots in the top right corner &amp; press “Оpеn in browsеr” 💚💚</div>
  <a class="button" href="https://t.me/+ipSPiiM8HiUzOWQx">✈️ Lipbalm inventory list</a>
  <a class="button" href="sms:+17079414402?body=Hey%20I%20came%20from%20your%20page">💬 iMessage / SMS (click here)</a>
