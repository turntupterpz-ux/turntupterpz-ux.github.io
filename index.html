<script>
document.querySelectorAll('.track-button').forEach(button=>{
button.addEventListener('click',function(e){
e.preventDefault();
const destination=this.href;
gtag('event','button_click',{event_category:'engagement'});
setTimeout(()=>{window.location.href=destination;},180);
});
});

function openImage(src){
document.getElementById('lightboxImage').src=src;
document.getElementById('lightbox').classList.add('active');
}
function closeImage(){
document.getElementById('lightbox').classList.remove('active');
}

<script>
window.addEventListener('load',()=>{
  const scroller=document.querySelector('.vouch-scroll');
  if(!scroller) return;

  let pos=0;

  setInterval(()=>{
    pos += 12;   // much faster

    if(pos >= scroller.scrollWidth - scroller.clientWidth){
      pos = 0;
    }

    scroller.scrollLeft = pos;
  },30);
});
