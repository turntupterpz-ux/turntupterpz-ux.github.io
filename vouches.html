<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050510">
<title>TurntUpTerpz — Vouches</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 20% 15%, rgba(0,255,190,.24), transparent 26%),
    radial-gradient(circle at 85% 80%, rgba(175,85,255,.22), transparent 28%),
    linear-gradient(135deg,#050510,#07141d,#040a0e);
}
header{
  position:sticky;
  top:0;
  z-index:5;
  backdrop-filter:blur(18px);
  background:rgba(0,0,0,.28);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.nav{
  max-width:1100px;
  margin:auto;
  padding:16px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:800;
  letter-spacing:-.5px;
}
.brand img{
  width:42px;height:42px;border-radius:50%;
}
.links{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.links a{
  text-decoration:none;
  color:#fff;
  font-size:13px;
  padding:10px 14px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.08);
}
.hero{
  max-width:1100px;
  margin:auto;
  padding:26px 18px 10px;
}
.hero h1{
  margin:0;
  font-size:clamp(32px,5vw,58px);
  letter-spacing:-2px;
}
.hero p{
  margin:10px 0 0;
  max-width:680px;
  color:rgba(255,255,255,.72);
  line-height:1.5;
}
.grid{
  max-width:1100px;
  margin:auto;
  padding:18px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:14px;
}
.card{
  position:relative;
  aspect-ratio:1/1.2;
  border-radius:22px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.05);
  box-shadow:0 12px 35px rgba(0,0,0,.35);
}
.card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:.25s ease;
}
.card:hover img{transform:scale(1.04)}
.badge{
  position:absolute;
  left:12px;
  bottom:12px;
  padding:7px 10px;
  border-radius:999px;
  background:rgba(0,0,0,.48);
  border:1px solid rgba(255,255,255,.08);
  font-size:12px;
}
.footer{
  max-width:1100px;
  margin:8px auto 24px;
  padding:0 18px 20px;
  color:rgba(255,255,255,.55);
  font-size:12px;
}
</style>
</head>
<body>
<header>
  <div class="nav">
    <div class="brand">
      <img src="logo.png" alt="logo">
      <div>TurntUpTerpz Vouches</div>
    </div>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="https://t.me/+ipSPiiM8HiUzOWQx">Telegram</a>
      <a href="sms:+17079414402?body=Hey%20I%20came%20from%20your%20page">SMS</a>
    </div>
  </div>
</header>

<section class="hero">
  <h1>Customer Vouches</h1>
</section>

<section class="grid">
  <div class="card"><img src="1.jpg" alt="Vouch 1"></div>
  <div class="card"><img src="2.jpg" alt="Vouch 2"></div>
  <div class="card"><img src="3.jpg" alt="Vouch 3"></div>
  <div class="card"><img src="4.jpg" alt="Vouch 4"></div>
  <div class="card"><img src="5.jpg" alt="Vouch 5"></div>
  <div class="card"><img src="6.jpg" alt="Vouch 6"></div>
  <div class="card"><img src="7.jpg" alt="Vouch 7"></div>
  <div class="card"><img src="8.jpg" alt="Vouch 8"></div>
  <div class="card"><img src="9.jpg" alt="Vouch 9"></div>
  <div class="card"><img src="10.jpg" alt="Vouch 10"></div>
  <div class="card"><img src="11.jpeg" alt="Vouch 11"></div>
  <div class="card"><img src="12.jpeg" alt="Vouch 12"></div>
  <div class="card"><img src="13.jpeg" alt="Vouch 13"></div>
</section>

<div class="footer">Tap a card to inspect the proof screenshots more clearly.</div>
</body>
</html>
