<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>TurntUpTerpz Vouches</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:'Inter',sans-serif;
  color:white;
  overflow-x:hidden;

  background:
    radial-gradient(circle at 20% 20%, rgba(0,255,170,.12), transparent 30%),
    radial-gradient(circle at 80% 20%, rgba(170,80,255,.12), transparent 30%),
    linear-gradient(135deg,#020611,#03161a,#041510);

  min-height:100vh;
}

/* STARS */

.bg{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}

.star{
  position:absolute;
  color:white;
  opacity:.8;

  text-shadow:
    0 0 8px rgba(255,255,255,.9),
    0 0 20px rgba(0,255,200,.35),
    0 0 35px rgba(168,85,247,.3);

  animation:float linear infinite;
}

.star:nth-child(1){left:5%;top:110%;font-size:12px;animation-duration:15s;}
.star:nth-child(2){left:12%;top:104%;font-size:18px;animation-duration:18s;}
.star:nth-child(3){left:24%;top:108%;font-size:10px;animation-duration:13s;}
.star:nth-child(4){left:36%;top:106%;font-size:14px;animation-duration:19s;}
.star:nth-child(5){left:47%;top:110%;font-size:20px;animation-duration:22s;}
.star:nth-child(6){left:58%;top:105%;font-size:11px;animation-duration:16s;}
.star:nth-child(7){left:69%;top:108%;font-size:16px;animation-duration:20s;}
.star:nth-child(8){left:82%;top:110%;font-size:13px;animation-duration:17s;}
.star:nth-child(9){left:94%;top:104%;font-size:18px;animation-duration:24s;}

@keyframes float{
  0%{
    transform:translateY(0) rotate(0deg);
    opacity:0;
  }

  10%{
    opacity:.8;
  }

  100%{
    transform:translateY(-120vh) rotate(180deg);
    opacity:0;
  }
}

/* TOP */

.top{
  position:sticky;
  top:0;
  z-index:50;

  backdrop-filter:blur(16px);

  background:rgba(0,0,0,.28);

  border-bottom:1px solid rgba(255,255,255,.06);

  padding:18px 16px;
}

.top-inner{
  max-width:520px;
  margin:auto;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:68px;
  height:68px;
  border-radius:50%;
  object-fit:cover;

  box-shadow:
    0 0 25px rgba(0,255,180,.22);
}

.brand-text h1{
  font-size:20px;
  font-weight:800;
  line-height:1.05;
}

.brand-text span{
  font-size:14px;
  opacity:.7;
}

/* BUTTON ROW */

.nav{
  margin-top:16px;

  display:flex;
  gap:10px;
}

.nav a{
  flex:1;

  display:flex;
  justify-content:center;
  align-items:center;

  text-decoration:none;
  color:white;

  height:50px;

  border-radius:999px;

  background:rgba(255,255,255,.06);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(12px);

  font-size:15px;
  font-weight:600;

  transition:.15s ease;

  box-shadow:
    inset 0 0 15px rgba(255,255,255,.02),
    0 0 20px rgba(0,0,0,.15);
}

.nav a:active{
  transform:scale(.94);
}

/* PAGE */

.container{
  position:relative;
  z-index:2;

  max-width:520px;
  margin:auto;

  padding:22px 16px 40px;
}

.hero h2{
  font-size:56px;
  line-height:.92;
  letter-spacing:-3px;

  margin-bottom:12px;

  background:
    linear-gradient(
      90deg,
      #ffffff,
      #7cffc4,
      #d0b3ff,
      #ffffff
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  font-size:17px;
  line-height:1.6;

  color:rgba(255,255,255,.72);

  margin-bottom:28px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.card{
  position:relative;

  overflow:hidden;

  border-radius:28px;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  box-shadow:
    0 12px 30px rgba(0,0,0,.35);

  transition:.15s ease;
}

.card:active{
  transform:scale(.97);
}

.card img{
  width:100%;
  display:block;
  cursor:pointer;
}

/* LIGHTBOX */

.lightbox{
  position:fixed;
  inset:0;

  display:flex;
  justify-content:center;
  align-items:center;

  background:rgba(0,0,0,.96);

  padding:18px;

  opacity:0;
  visibility:hidden;

  transition:.2s ease;

  z-index:99999;
}

.lightbox.active{
  opacity:1;
  visibility:visible;
}

.lightbox img{
  width:auto;
  max-width:100%;
  max-height:92vh;

  border-radius:24px;

  box-shadow:
    0 0 40px rgba(0,255,180,.2),
    0 0 80px rgba(168,85,247,.18);
}

/* MOBILE */

@media(max-width:480px){

  .hero h2{
    font-size:44px;
  }

}

</style>
</head>

<script>

const lightbox =
  document.getElementById('lightbox');

const lightboxImg =
  document.getElementById('lightbox-img');

function openImage(src){

  lightboxImg.src = src;

  lightbox.classList.add('active');

}

/* CLOSE ON TAP */

lightbox.addEventListener('click', () => {

  lightbox.classList.remove('active');

});

/* ESC CLOSE */

document.addEventListener('keydown', (e) => {

  if(e.key === 'Escape'){

    lightbox.classList.remove('active');

  }

});
